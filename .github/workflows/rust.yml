name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    # Fail fast on root-pin vs nested-crate dependency conflicts (the icu/parley
    # class) — resolution only, no full build.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Resolve all crates against frozen root manifest
      run: scripts/check-nested-crates.sh

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install preview dependencies
      run: npm ci --prefix preview
    - name: Check preview formatting
      run: npm run format:check --prefix preview
    - name: Test snapshot publication and adoption
      run: npm test --prefix preview
    - name: Test preview release updater
      run: npm run test:update --prefix preview
    - name: Build public preview assets
      run: npm run build --prefix preview
