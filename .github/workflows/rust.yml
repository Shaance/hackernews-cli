name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install preview dependencies
      run: npm ci --prefix preview
    - name: Check preview formatting
      run: npm run format:check --prefix preview
    - name: Test snapshot publication and adoption
      run: npm test --prefix preview
    - name: Build public preview assets
      run: npm run build --prefix preview
