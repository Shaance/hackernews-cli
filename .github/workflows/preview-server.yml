# Builds and signs the preview server image. Hosts pull the release from GHCR.
name: Preview server

on:
  push:
    branches: [main]
    paths: &release-paths
      - 'src/**'
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - preview/Dockerfile
      - preview/server.mjs
      - preview/docker.mjs
      - preview/adopt.mjs
      - preview/publish.mjs
      - preview/package.json
      - preview/package-lock.json
      - preview/index.html
      - preview/app.js
      - preview/style.css
      - preview/favicon.svg
      - .github/workflows/preview-server.yml
  pull_request:
    paths: *release-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'preview-server' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
env:
  IMAGE: ghcr.io/shaance/hn-preview
  COMMIT: ${{ github.sha }}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: preview/Dockerfile
          tags: hn-preview:check
          load: true
          cache-from: type=gha,scope=preview-server
      - name: Check image contents
        env:
          CHECK_IMAGE: hn-preview:check
        run: &check-image |
          docker run --rm --pull=never --entrypoint /bin/sh "$CHECK_IMAGE" -ec '
            for file in /usr/local/bin/hn /opt/release/server.mjs /opt/release/docker.mjs \
              /opt/release/adopt.mjs /opt/release/publish.mjs /opt/release/index.html \
              /opt/release/app.js /opt/release/style.css /opt/release/favicon.svg; do
              test -f "$file" && test -r "$file" || { echo "Missing or unreadable: $file" >&2; exit 1; }
            done
            test -x /usr/local/bin/hn
            test -d /opt/release/node_modules
          '

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Count commits
        run: |
          count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$count" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: preview/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.COMMIT }}
          build-args: |
            COMMIT=${{ env.COMMIT }}
            COMMIT_COUNT=${{ env.COMMIT_COUNT }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=preview-server
          cache-to: type=gha,scope=preview-server,mode=max
      - uses: imjasonh/setup-crane@v0.7
      - name: Pull the release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="$IMAGE@$DIGEST"
          crane manifest "$ref" | jq -e 'has("config") and has("layers")' > /dev/null
          docker pull "$ref"
          echo "CHECK_IMAGE=$ref" >> "$GITHUB_ENV"
      - name: Check image contents
        run: *check-image
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign and verify the release digest
        run: |
          cosign sign --yes -a "commit=$COMMIT" -a "commit_count=$COMMIT_COUNT" "$CHECK_IMAGE"
          cosign verify \
            --certificate-identity https://github.com/Shaance/hn/.github/workflows/preview-server.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$CHECK_IMAGE"
      - name: Advance the main tag
        run: |
          if config=$(crane config "$IMAGE:main" 2>&1); then
            previous=$(jq -er '.config.Labels["dev.hashcode.hn-preview.commit_count"] | strings | select(test("^[1-9][0-9]*$"))' <<< "$config")
            if (( COMMIT_COUNT <= previous )); then
              echo "Main is already at commit count $previous"
              exit 0
            fi
          elif [[ "$config" != *MANIFEST_UNKNOWN* ]]; then
            echo "$config" >&2
            exit 1
          fi
          crane tag "$CHECK_IMAGE" main
  alert:
    needs: release
    if: failure() && needs.release.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report release failure
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Preview server release failed"
          if ! gh api "repos/$GH_REPO/labels/preview-alert" > /dev/null; then
            gh label create preview-alert
          fi
          issue=$(gh api --paginate "repos/$GH_REPO/issues?state=open&labels=preview-alert&per_page=100" |
            jq -sr --arg title "$title" 'first(.[][] | select(.title == $title and (has("pull_request") | not)) | .number) // empty')
          body=$(printf 'Commit %s failed in [this workflow run](%s/%s/actions/runs/%s).' \
            "$COMMIT" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --label preview-alert --body "$body"
          fi
