name: Feature request
description: Suggest an improvement to hn.
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Terminal
        - macOS
        - Both
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What change would help?
